name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install hash-locked offline test dependencies
        run: |
          python -m pip install --require-hashes --only-binary :all: -r requirements-test.lock
      - name: Run offline regression suite
        run: PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q openstack_cloud_poc scripts/local-openstack tests
      - name: Validate maintained-release guard CLI
        run: |
          python -B scripts/check_release_policy.py --help
          python -B scripts/manage_application_recovery.py --help
          python -B scripts/audit_rabbitmq_upgrade_sources.py --help
      - name: Check patch whitespace
        run: git diff --check

  windows-syntax:
    name: Windows recovery script syntax (no WSL actions)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Parse PowerShell recovery scripts without executing them
        shell: pwsh
        run: |
          Get-ChildItem deployment/windows/*.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count) { throw ($errors | Out-String) }
          }
      - name: Verify offline VHD read guards with synthetic files
        shell: pwsh
        run: ./tests/windows/Test-ExportPocWslBackup.ps1

  dependency-advisories:
    name: Published dependency advisories (exact pins and dated dispositions)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -B scripts/audit_dependency_advisories.py

  deployment-syntax:
    name: Staging deployment syntax
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pinned staging automation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r deployment/kolla/requirements.lock
      - name: Validate Kolla inventory and read-only preflight syntax
        run: |
          ansible-inventory -i deployment/kolla/inventory/multinode.example.ini --list >/dev/null
          ansible-playbook -i deployment/kolla/inventory/multinode.example.ini deployment/kolla/preflight.yml --syntax-check
