# Enable only after the Horizon package, local settings and private TLS
# certificate are ready. This listener does not alter the shared port 80 vhosts.
Listen 127.0.0.1:8443

<VirtualHost 127.0.0.1:8443>
    ServerName localhost
    SSLEngine on
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCertificateFile /etc/ssl/certs/horizon-poc-local.crt
    SSLCertificateKeyFile /etc/ssl/private/horizon-poc-local.key

    WSGIDaemonProcess horizon user=horizon group=horizon processes=1 threads=5 display-name=%{GROUP}
    WSGIProcessGroup horizon
    WSGIApplicationGroup %{GLOBAL}
    WSGIScriptAlias /horizon /usr/share/openstack-dashboard/openstack_dashboard/wsgi.py process-group=horizon

    Alias /horizon/static /var/lib/openstack-dashboard/static/
    <Directory /usr/share/openstack-dashboard/openstack_dashboard>
        Require local
    </Directory>
    <Directory /var/lib/openstack-dashboard/static>
        Require local
    </Directory>
    <Location /horizon>
        Require local
    </Location>

    ErrorLog ${APACHE_LOG_DIR}/horizon-local-error.log
    CustomLog ${APACHE_LOG_DIR}/horizon-local-access.log combined
</VirtualHost>
