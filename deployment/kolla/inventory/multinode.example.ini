# Documentation-only inventory using TEST-NET addresses (RFC 5737).
# Replace every address and group membership after Gate 0/1 selects the target.
# Keep credentials and private keys outside this repository.

[deployment]
controller-1 ansible_host=192.0.2.11

[control]
controller-1 ansible_host=192.0.2.11
controller-2 ansible_host=192.0.2.12
controller-3 ansible_host=192.0.2.13

[network:children]
control

[compute]
compute-1 ansible_host=198.51.100.21
compute-2 ansible_host=198.51.100.22

[monitoring]
controller-1 ansible_host=192.0.2.11

[storage]
storage-1 ansible_host=203.0.113.31
storage-2 ansible_host=203.0.113.32
storage-3 ansible_host=203.0.113.33

[all:vars]
ansible_user=ubuntu
ansible_become=true
