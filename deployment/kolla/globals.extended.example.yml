---
# Optional service profile overlay. Merge only after backend and resource
# decisions are approved; this file alone is not a deployable configuration.
enable_cinder: "yes"
enable_swift: "yes"
enable_ceilometer: "yes"
enable_gnocchi: "yes"
enable_prometheus: "yes"
enable_grafana: "yes"
enable_fluentd: "yes"

# Cinder backend configuration is vendor/target-specific. Never point the
# LVM backend at an existing or unreviewed device. Create/verify a dedicated
# volume group through the storage operator's reviewed procedure.
enable_cinder_backend_lvm: "no"
